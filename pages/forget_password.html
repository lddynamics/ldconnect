<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L&D Connect - Mot de passe oublié</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/forget.css">
</head>
<body>
    <div class="forgot-container">
        <!-- En-tête -->
        <div class="forgot-header">
            <div class="icon-wrapper">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="logo">L&D Connect</h1>
            <h2 class="title">Mot de passe oublié ?</h2>
            <p class="subtitle">Entrez votre adresse email et nous vous enverrons un code de réinitialisation</p>
        </div>

        <!-- Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <div class="info-message" id="infoMessage"></div>

        <!-- Étape 1 : Demande d'email -->
        <div id="emailStep">
            <form class="forgot-form" id="forgotForm">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="votre@email.com"
                            required
                        >
                        <span class="input-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="submitBtn">
                    <span class="spinner"></span>
                    <span class="button-text">
                        <i class="fa-solid fa-paper-plane"></i>
                        Envoyer le code
                    </span>
                </button>
            </form>
        </div>

        <!-- Étape 2 : Vérification du code -->
        <div id="verificationStep" class="verification-step">
            <div class="forgot-form">
                <div class="form-group">
                    <label style="text-align: center; display: block;">Code de vérification</label>
                    <p class="subtitle" style="text-align: center; margin-bottom: 20px;">
                        Entrez le code à 6 chiffres envoyé à <strong id="emailDisplay"></strong>
                    </p>
                    <div class="code-inputs">
                        <input type="text" maxlength="1" class="code-input" id="code1" pattern="\d*">
                        <input type="text" maxlength="1" class="code-input" id="code2" pattern="\d*">
                        <input type="text" maxlength="1" class="code-input" id="code3" pattern="\d*">
                        <input type="text" maxlength="1" class="code-input" id="code4" pattern="\d*">
                        <input type="text" maxlength="1" class="code-input" id="code5" pattern="\d*">
                        <input type="text" maxlength="1" class="code-input" id="code6" pattern="\d*">
                    </div>
                    <div class="resend-link">
                        Vous n'avez pas reçu le code ? 
                        <button id="resendBtn">Renvoyer</button>
                        <span id="resendTimer" style="display: none;"> (00:<span id="seconds">30</span>)</span>
                    </div>
                </div>

                <button type="button" class="submit-button" id="verifyBtn">
                    <span class="spinner"></span>
                    <span class="button-text">
                        <i class="fa-solid fa-check"></i>
                        Vérifier le code
                    </span>
                </button>
            </div>
        </div>

        <!-- Lien retour -->
        <div class="back-link">
            <a href="../login.html">
                <i class="fa-solid fa-arrow-left"></i>
                Retour à la connexion
            </a>
        </div>

        <!-- Pied de page -->
        <div class="forgot-footer">
            <p>&copy; 2026 L&D Connect. Tous droits réservés.</p>
        </div>
    </div>

    <script src="../js/forget.js"></script>
</body>
</html>
